
name: Deploy PHP Native to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_INFINITY }}
          username: ${{ secrets.FTP_USERNAME_INFINITY }}
          password: ${{ secrets.FTP_PASSWORD_INFINITY }}
          protocol: ftp
          port: 21
          server-dir: /smksukapura.miw.web.id/htdocs/
          local-dir: ./
          exclude: |
            **/.git*
            **/.github/**
            **/.env
            **/.env.*
            **/node_modules/**
            dpmb
            dpmb/**

