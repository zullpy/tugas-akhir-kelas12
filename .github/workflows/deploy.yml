name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger Shared Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.hostinger_HOST }}
          username: ${{ secrets.hostinger_USER }}
          key: ${{ secrets.hostinger_SSH }}
          password: ${{ secrets.hostinger_PASSWORD }}
          port: ${{ secrets.hostinger_PORT || 65002 }}
          script: |
            TARGET_DIR="${{ secrets.hostinger_TARGET_DIR || '/home/u673037475/domains/zoel.my.id/public_html/web-sekolah' }}"
            REPO_URL="https://github.com/zullpy/tugas-akhir-kelas12.git"

            echo "🚀 Memulai proses deployment ke Hostinger..."
            echo "📁 Direktori target: $TARGET_DIR"

            # Buat direktori jika belum ada
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR" || exit 1

            # Hindari error safe directory
            git config --global --add safe.directory "$TARGET_DIR" 2>/dev/null || true

            # Inisialisasi git jika folder belum pernah di-clone
            if [ ! -d ".git" ]; then
              echo "📦 Folder belum ada repository Git, melakukan git clone awal..."
              git clone "$REPO_URL" .
            else
              echo "📥 Mengambil kode terbaru dari GitHub..."
              git fetch origin main
              git reset --hard origin/main
            fi

            # Siapkan file .env jika belum ada
            if [ ! -f ".env" ]; then
              echo "⚙️ Menyiapkan file .env dari .env.example..."
              if [ -f ".env.example" ]; then
                cp .env.example .env
                sed -i 's/APP_ENV=local/APP_ENV=production/g' .env
              fi
            fi

            echo "🔧 Memastikan folder upload & perizinan file..."
            mkdir -p spmb/uploads/temp_pdf
            chmod -R 755 spmb/uploads

            echo "✅ Deployment selesai dengan sukses!"
